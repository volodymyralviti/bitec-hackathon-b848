# Include inside nginx http {}, for example /etc/nginx/conf.d/eds.conf.
# Replace simulator.example.invalid and provision certificates BEFORE enabling.
map $http_upgrade $eds_connection_upgrade {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=eds_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=eds_author:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=eds_rooms:10m rate=3r/m;
limit_conn_zone $binary_remote_addr zone=eds_connections:10m;

server {
    listen 80;
    server_name simulator.example.invalid;
    access_log off;
    error_log /dev/null;
    return 308 https://simulator.example.invalid$request_uri;
}

server {
    listen 443 ssl;
    server_name simulator.example.invalid;
    ssl_certificate /etc/eds/tls/fullchain.pem;
    ssl_certificate_key /etc/eds/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /srv/eds/current/apps/client/dist/client/browser;
    include /etc/nginx/mime.types;
    access_log off;
    error_log /dev/null;
    client_max_body_size 1m;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    location ^~ /api/classroom-socket {
        limit_req zone=eds_api burst=30 nodelay;
        # Shared classroom Wi-Fi may put many people behind one IP.
        limit_conn eds_connections 120;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $eds_connection_upgrade;
        proxy_read_timeout 75s;
        proxy_buffering off;
    }
    location ^~ /api/author/ {
        limit_req zone=eds_author burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
    location ^~ /api/reviewer/ {
        limit_req zone=eds_author burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
    location = /api/classrooms {
        limit_req zone=eds_rooms burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $http_host;
    }
    location ^~ /api/ {
        limit_req zone=eds_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $http_host;
    }
    location = /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $http_host;
    }
    location ~ /\. {
        return 404;
    }
    # Missing JSON/static files must never be replaced by an HTML SPA response.
    location ~* \.(json|js|css|ico|png|svg|woff2?)$ {
        try_files $uri =404;
    }
    location / {
        # Do not add $uri/: /scenarios is also a physical asset directory.
        try_files $uri /index.html;
    }
}
