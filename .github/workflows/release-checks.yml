name: MVP release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # Official action SHAs verified from upstream tags; update deliberately.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Select installed Chromium
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo 'CHROME_BIN=C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe' >> "$GITHUB_ENV"
          else
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Content and complete engine routes
        run: |
          node content/qa/validate.mjs
          node --test content/qa/content.test.mjs
          node apps/client/scripts/check-solo-routes.mjs
          node scripts/check-release-safety.mjs
      - name: Production-browser smoke (isolated synthetic data only)
        run: |
          node apps/client/scripts/smoke-solo.mjs
          node apps/client/scripts/smoke-studio.mjs
          node apps/client/scripts/smoke-demo-studio.mjs
          node apps/client/scripts/smoke-classroom.mjs
      - run: git diff --check
      # No deploy, publish, app secrets, write permissions, learner data or temp-store artifacts.
