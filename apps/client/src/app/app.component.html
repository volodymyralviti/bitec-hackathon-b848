<main>
  <h1>Симулятор етичних дилем</h1>
  <p role="status" aria-live="polite" [attr.aria-busy]="status() === 'loading'">
    @switch (status()) {
      @case ('loading') { Перевіряємо з’єднання із сервером… }
      @case ('success') { Сервер доступний }
      @case ('error') { Не вдалося з’єднатися із сервером }
    }
  </p>
  <button type="button" (click)="checkConnection()" [disabled]="status() === 'loading'">
    Перевірити знову
  </button>
</main>
